name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify the model download links (official Qwen Hugging Face repos)
        run: |
          for u in \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"; do
            code=$(curl -sL -r 0-3 -o /tmp/head.bin -w "%{http_code}" "$u")
            magic=$(head -c 4 /tmp/head.bin)
            echo "$code $magic $u"
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then echo "::error::model link is broken: $u"; exit 1; fi
            if [ "$magic" != "GGUF" ]; then echo "::error::not a GGUF file: $u"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix -- --legacy-peer-deps
      - run: npx expo prebuild --platform android --clean
      - name: Copy notification icons into Android resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icons/ic_tuik_notif_*.png android/app/src/main/res/drawable/ 2>/dev/null || true
      - name: Fix duplicate android.support classes (old voice lib)
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: Sheet.md-apk
          path: android/app/build/outputs/apk/release/*.apk
