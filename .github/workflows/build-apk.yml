name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify the model download links (official Qwen Hugging Face repos)
        run: |
          for u in \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"; do
            code=$(curl -sL -r 0-3 -o /tmp/head.bin -w "%{http_code}" "$u")
            magic=$(head -c 4 /tmp/head.bin)
            echo "$code $magic $u"
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then echo "::error::model link is broken: $u"; exit 1; fi
            if [ "$magic" != "GGUF" ]; then echo "::error::not a GGUF file: $u"; exit 1; fi
          done
      - name: Verify Piper + Pocket voice model links (official sherpa-onnx release repos)
        run: |
          voices=(
            "en_US-lessac-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium.tar.bz2"
            "en_US-amy-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-medium.tar.bz2"
            "en_US-ryan-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ryan-medium.tar.bz2"
            "en_US-joe-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-joe-medium.tar.bz2"
            "en_US-kusal-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-kusal-medium.tar.bz2"
            "en_US-hfc_female-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-hfc_female-medium.tar.bz2"
            "en_US-hfc_male-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-hfc_male-medium.tar.bz2"
            "en_US-norman-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-norman-medium.tar.bz2"
            "en_GB-alan-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_GB-alan-medium.tar.bz2"
            "en_GB-jenny_dioco-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_GB-jenny_dioco-medium.tar.bz2"
            "en_GB-alba-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_GB-alba-medium.tar.bz2"
            "en_GB-northern_english_male-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_GB-northern_english_male-medium.tar.bz2"
            "en_US-john-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-john-medium.tar.bz2"
            "en_US-kathleen-low https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-kathleen-low.tar.bz2"
            "en_US-danny-low https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-danny-low.tar.bz2"
            "en_GB-cori-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_GB-cori-medium.tar.bz2"
            "en_US-arctic-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-arctic-medium.tar.bz2"
            "en_US-l2arctic-medium https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-l2arctic-medium.tar.bz2"
            "pocket-tts-int8-2026-01-26 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2"
          )
          for entry in "${voices[@]}"; do
            id=$(echo "$entry" | cut -d' ' -f1)
            u=$(echo "$entry" | cut -d' ' -f2)
            code=$(curl -sL -r 0-2 -o /tmp/head_bz2.bin -w "%{http_code}" "$u")
            magic=$(head -c 3 /tmp/head_bz2.bin)
            size=$(curl -sI -L "$u" | grep -i '^content-length:' | tail -n 1 | tr -d '\r' | awk '{print $2}')
            echo "$id: HTTP $code | Magic $magic | Real size: $size bytes | URL: $u"
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then echo "::error::voice model link is broken: $u"; exit 1; fi
            if [ "$magic" != "BZh" ]; then echo "::error::not a tar.bz2 file: $u"; exit 1; fi
          done
      - name: Verify the offline listening (STT) model links
        run: |
          base="https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26/resolve/main"
          for f in tokens.txt encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx decoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx joiner-epoch-99-avg-1-chunk-16-left-128.int8.onnx; do
            code=$(curl -sIL -o /dev/null -w "%{http_code}" "$base/$f")
            echo "$code $f"
            if [ "$code" != "200" ]; then echo "::error::STT model file link is broken: $base/$f"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Cache C++ compiles (ccache) for llama.rn / native modules
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-arm64
          max-size: 1G
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix -- --legacy-peer-deps
      - name: Download pinned sherpa-onnx Android arm64-v8a native libraries
        env:
          SHERPA_ONNX_VERSION: "v1.13.8"
        run: |
          mkdir -p modules/sheet-tts/android/src/main/jniLibs/arm64-v8a
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}-android.tar.bz2"
          echo "Downloading sherpa-onnx ${SHERPA_ONNX_VERSION} from $URL"
          curl -sSL "$URL" -o /tmp/sherpa-android.tar.bz2
          if [ ! -s /tmp/sherpa-android.tar.bz2 ]; then
            echo "::error::Failed to download sherpa-onnx native libraries from $URL"
            exit 1
          fi
          mkdir -p /tmp/sherpa_extracted
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa_extracted
          cp /tmp/sherpa_extracted/jniLibs/arm64-v8a/libsherpa-onnx-jni.so modules/sheet-tts/android/src/main/jniLibs/arm64-v8a/
          cp /tmp/sherpa_extracted/jniLibs/arm64-v8a/libonnxruntime.so modules/sheet-tts/android/src/main/jniLibs/arm64-v8a/
          for f in libsherpa-onnx-jni.so libonnxruntime.so; do
            p="modules/sheet-tts/android/src/main/jniLibs/arm64-v8a/$f"
            if [ ! -s "$p" ]; then
              echo "::error::Missing or empty native library: $p"
              exit 1
            fi
            echo "Verified $f size: $(wc -c < "$p") bytes"
          done
          rm -rf /tmp/sherpa_extracted /tmp/sherpa-android.tar.bz2
      - name: Download sherpa-onnx Kotlin API for speech recognition (same version as the native libs)
        env:
          SHERPA_ONNX_VERSION: "v1.13.8"
        run: |
          D=modules/sheet-tts/android/src/main/java/com/k2fsa/sherpa/onnx
          for f in OnlineRecognizer OnlineStream FeatureConfig HomophoneReplacerConfig; do
            code=$(curl -sSL -w "%{http_code}" -o "$D/$f.kt" "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/${SHERPA_ONNX_VERSION}/sherpa-onnx/kotlin-api/$f.kt")
            echo "$code $f.kt"
            if [ "$code" != "200" ]; then
              if [ "$f" = "HomophoneReplacerConfig" ]; then rm -f "$D/$f.kt"; continue; fi
              echo "::error::Could not download $f.kt"; exit 1
            fi
          done
          ls -la "$D"
      - run: npx expo prebuild --platform android --clean
      - name: Copy notification icons into Android resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icons/ic_tuik_notif_*.png android/app/src/main/res/drawable/ 2>/dev/null || true
      - name: Fix duplicate android.support classes (old voice lib)
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
      - name: Build release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: Sheet.md-apk
          path: android/app/build/outputs/apk/release/*.apk
