plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.sheetservice'
version = '1.0.0'
android {
  namespace "expo.modules.sheetservice"
  defaultConfig { versionCode 1; versionName "1.0.0" }
  lint { abortOnError false }
}
dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  compileOnly 'com.facebook.react:react-android'      // HeadlessJsTaskService (keeps JS timers alive in the background)
}
